# Sector-module -> NotebookLM notebook_id registry.
#
# Populated by soic_wiki.notebooklm_sector_pipeline.ensure_sector_notebook,
# which creates a notebook the first time a slug is seen and reuses it on
# every subsequent run (idempotent -- never creates a duplicate for the
# same slug). `keywords:` is human-curated per sector (drafted here from
# each sector's actual concept-note content) and is what sector_router.py
# ranks on -- a sector with no keywords can never be matched. Adding a new
# sector here is the ONLY wiring decision_engine needs; it never changes.
